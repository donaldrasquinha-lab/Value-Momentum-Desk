name: Value Momentum Scan

on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:
    inputs:
      fund_budget:
        description: "Minutes to spend refreshing fundamentals"
        default: "35"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: value-momentum-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan all NSE stocks
        env:
          FUND_BUDGET_MIN: ${{ inputs.fund_budget || '35' }}
          OUT_DIR: data
        run: python scan.py
      - name: Save fundamentals cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/ || true
          git diff --cached --quiet || (git commit -m "cache: fundamentals $(date -u +%F)" && git pull --rebase && git push)
      - name: Prepare site
        run: mkdir -p _site && cp index.html _site/ && cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
